name: Post next approved graphic

on:
  schedule:
    # Each run posts one post-id per platform, and we push 2 approved
    # posts/day — so two triggers/day, matching the content cadence.
    # Times are anchored to US Eastern, currently EDT (UTC-4). Cron is
    # fixed UTC and doesn't shift for DST, so these will read as
    # ~6:00 AM / ~7:00 PM ET once EST (UTC-5) kicks in around November.
    # Update the UTC hour by 1 at each DST transition if that drift matters.
    - cron: "0 11 * * *" # ~7:00 AM ET
    - cron: "0 0 * * *"  # ~8:00 PM ET
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run poster
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/post.py

      - name: Log result
        if: always()
        run: |
          git config user.name "belovd-poster"
          git config user.email "actions@users.noreply.github.com"
          git add posted-log.md
          git diff --cached --quiet || git commit -m "Log post result [skip ci]"
          git push
