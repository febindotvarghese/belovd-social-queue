name: Post next approved graphic

on:
  schedule:
    # ONE post per day, at 7:00 AM US Eastern.
    #
    # Two cron lines, but NOT two runs/day: each matches only during one half
    # of the year, so exactly one fires on any given date. GitHub cron is
    # fixed UTC and never shifts for DST, so a single line silently becomes
    # 6 AM ET every November. These two keep 7 AM ET year-round.
    #
    #   11:00 UTC = 7 AM EDT (Mar-Oct, UTC-4)
    #   12:00 UTC = 7 AM EST (Nov-Feb, UTC-5)
    #
    # In the overlap months both lines fire, so the job's first step checks
    # the real local Eastern hour and exits unless it is 7 AM. That guard is
    # what actually enforces the schedule -- keep it if you touch these.
    #
    # The queue holds one folder per day because the app schedules exactly one
    # affirmation per day. A second daily trigger would not double output, it
    # would drain the queue twice as fast and then post nothing.
    - cron: "0 11 * * *" # 7 AM EDT
    - cron: "0 12 * * *" # 7 AM EST
  workflow_dispatch:
    inputs:
      post_ahead:
        description: "Publish the next post even if it is dated in the future"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub dispatches scheduled jobs late -- on this repo, routinely by
      # 3-5 hours. So we CANNOT gate on "is it 7 AM ET right now": a run for
      # the 7 AM slot often executes at 11 AM ET or later, and an hour check
      # would skip every one of them. (It did, on 2026-09-17: two runs landed
      # at ET hour 11 and both skipped, publishing nothing all day.)
      #
      # Gate on the Eastern DAY instead. Both cron lines are due before 8 AM
      # ET, so the first run to arrive on a given Eastern date is that date's
      # 7 AM slot, however late it actually starts. Any second run the same
      # day is the off-season twin and stops here.
      - name: Claim today's Eastern slot
        id: slot
        run: |
          # A manual dispatch is still TODAY'S post -- it must claim the
          # Eastern day like any other run. It previously bypassed the claim
          # entirely, so on 2026-09-18 a manual run published that day's post
          # without claiming, the scheduled run then found the day unclaimed
          # and published the NEXT day's post too. Two posts, one day.
          # Manual dispatch may still re-run a day that is already claimed
          # (that is the point of it), but it always records the claim.
          today=$(TZ=America/New_York date +%F)
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual dispatch for $today -- runs regardless of claim."
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "date=$today" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Eastern date: $today (ET hour $(TZ=America/New_York date +%-H))"
          if grep -q "^slot:$today\b" posted-log.md 2>/dev/null; then
            echo "Slot for $today already claimed -- skipping duplicate cron."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "date=$today" >> "$GITHUB_OUTPUT"
          fi


      - uses: actions/setup-python@v5
        if: steps.slot.outputs.go == 'true'
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
        if: steps.slot.outputs.go == 'true'

      - name: Run poster
        if: steps.slot.outputs.go == 'true'
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          POST_AHEAD: ${{ inputs.post_ahead && '1' || '0' }}
        run: python scripts/post.py

      - name: Log result
        if: always() && steps.slot.outputs.go == 'true'
        run: |
          git config user.name "belovd-poster"
          git config user.email "actions@users.noreply.github.com"
          # Mark this Eastern date as claimed so the off-season twin cron
          # (and any re-dispatch) does not post a second time today.
          if [ -n "${{ steps.slot.outputs.date }}" ]; then
            echo "slot:${{ steps.slot.outputs.date }} claimed" >> posted-log.md
          fi
          git add posted-log.md
          git diff --cached --quiet || git commit -m "Log post result [skip ci]"
          git push
